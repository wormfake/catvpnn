name: Build CatVPN Nord (APK & Jailbreak DEBs)

on:
  push:
    branches: [ main, master, 'codex/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (arm64)
        env:
          NORD_TOKEN: ${{ secrets.NORD_TOKEN }}
          NORD_PRIV_KEY: ${{ secrets.NORD_PRIV_KEY }}
          NORD_USER: ${{ secrets.NORD_USER }}
          NORD_PASS: ${{ secrets.NORD_PASS }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=NORD_TOKEN="$NORD_TOKEN" \
            --dart-define=NORD_PRIV_KEY="$NORD_PRIV_KEY" \
            --dart-define=NORD_USER="$NORD_USER" \
            --dart-define=NORD_PASS="$NORD_PASS"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CatVPN-Nord-Android-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: iOS Rootful / Rootless / RootHide DEBs
    # Pin the Intel host to avoid the constrained macOS arm64 runner queue.
    # Xcode still cross-compiles the iPhone app for arm64.
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Flutter and packaging
        run: |
          flutter analyze --no-fatal-infos
          flutter test
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/test_local_api.py

      - name: Build iOS Release (No Codesign)
        env:
          NORD_TOKEN: ${{ secrets.NORD_TOKEN }}
          NORD_PRIV_KEY: ${{ secrets.NORD_PRIV_KEY }}
          NORD_USER: ${{ secrets.NORD_USER }}
          NORD_PASS: ${{ secrets.NORD_PASS }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=NORD_TOKEN="$NORD_TOKEN" \
            --dart-define=NORD_PRIV_KEY="$NORD_PRIV_KEY" \
            --dart-define=NORD_USER="$NORD_USER" \
            --dart-define=NORD_PASS="$NORD_PASS"

      - name: Package three jailbreak variants
        run: |
          python3 scripts/build_ios_daemon.py
          python3 scripts/package_jailbreak.py

      - name: Upload jailbreak DEBs and APT index
        uses: actions/upload-artifact@v4
        with:
          name: CatVPN-Nord-Jailbreak-DEBs
          path: dist/jailbreak/
          if-no-files-found: error
